name: coaching_app
description: Course-selling mobile app with screenshot block, single-device login, and signed-URL video.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^10.0.0
  no_screenshot: ^0.3.0
  video_player: ^2.8.0
  provider: ^6.1.0
  razorpay_flutter: ^1.3.7
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
